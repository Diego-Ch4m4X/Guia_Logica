name: Build and deploy GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate static site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          check-latest: false

      - name: Verify pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .node-version)"
          actual="$(node --version | sed 's/^v//')"
          test "$actual" = "$expected"
          node --version
          npm --version

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Preflight canonical Markdown
        run: npm run preflight

      - name: Build Home and T01-T35
        run: npm run build

      - name: Validate generated site
        run: npm run validate

      - name: Run contract tests
        run: npm test

      - name: Validate Pages artifact input
        run: npm run validate:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: Smoke production site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_VERSION: 1.1.0-rc.1
    steps:
      - name: Verify production routes and assets
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_URL%/}/"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch() {
            local path="$1"
            local out="$2"
            curl --fail --location --silent --show-error               --retry 10 --retry-delay 3 --retry-all-errors               --connect-timeout 10 --max-time 45               "${base}${path}" -o "$out"
            test -s "$out"
          }

          for route in "" "topicos/t01/" "topicos/t24/" "topicos/t25/" "topicos/t35/"; do
            name="${route//\//_}"
            test -n "$name" || name="home"
            fetch "$route" "$tmp/$name.html"
            grep -qi '<!doctype html' "$tmp/$name.html"
          done

          fetch "assets/css/base.css?v=${EXPECTED_VERSION}" "$tmp/base.css"
          fetch "assets/js/app.js?v=${EXPECTED_VERSION}" "$tmp/app.js"
          fetch "assets/vendor/mermaid-11.17.2.min.js" "$tmp/mermaid.js"
          fetch "assets/vendor/highlight-11.12.0.min.js" "$tmp/highlight.js"
          fetch "data/topics.json" "$tmp/topics.json"
          fetch "data/search-index.json" "$tmp/search-index.json"
          fetch "data/package.json" "$tmp/package.json"

          grep -q "?v=${EXPECTED_VERSION}" "$tmp/home.html"
          grep -q '"version": "1.1.0-rc.1"' "$tmp/package.json"
          grep -q '"number": 35' "$tmp/topics.json"

          echo "PRODUCTION_SMOKE: PASS"
          echo "base_url=$base"
