name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate static site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          check-latest: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify pinned runtimes
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .node-version)"
          actual="$(node --version | sed 's/^v//')"
          test "$actual" = "$expected"
          node --version
          npm --version
          java -version

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Build Home and T01-T35 (includes preflight)
        run: npm run build

      - name: Validate generated site
        run: npm run validate

      - name: Validate HTML conformance
        run: npm run validate:html

      - name: Validate browser JavaScript syntax
        run: npm run validate:js

      - name: Run contract tests
        run: npm test

      - name: Validate Pages artifact input
        run: npm run validate:pages

      - name: Check external links
        run: npm run check:external-links

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: Smoke production site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Verify production routes and assets
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_URL%/}/"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch() {
            local path="$1"
            local out="$2"
            curl --fail --location --silent --show-error               --retry 10 --retry-delay 3 --retry-all-errors               --connect-timeout 10 --max-time 45               "${base}${path}" -o "$out"
            test -s "$out"
          }

          routes=("")
          for n in $(seq -w 1 35); do routes+=("topicos/t${n}/"); done
          route_count=0
          for route in "${routes[@]}"; do
            name="${route//\//_}"
            test -n "$name" || name="home"
            fetch "$route" "$tmp/$name.html"
            grep -qi '<!doctype html' "$tmp/$name.html"
            expected="https://diego-ch4m4x.github.io/Guia_Logica/${route}"
            grep -Fq "rel=\"canonical\" href=\"${expected}\"" "$tmp/$name.html"
            grep -Fq 'application/ld+json' "$tmp/$name.html"
            grep -Fq "property=\"og:url\" content=\"${expected}\"" "$tmp/$name.html"
            route_count=$((route_count + 1))
          done
          test "$route_count" = "36"

          fetch "data/package.json" "$tmp/package.json"
          published_version="$(sed -n 's/^[[:space:]]*"version": "\([^"]*\)".*/\1/p' "$tmp/package.json" | head -n 1)"
          test -n "$published_version"
          fetch "assets/css/base.css?v=${published_version}" "$tmp/base.css"
          fetch "assets/js/app.js?v=${published_version}" "$tmp/app.js"
          fetch "assets/vendor/mermaid-11.17.2.min.js" "$tmp/mermaid.js"
          fetch "assets/vendor/highlight-11.12.0.min.js" "$tmp/highlight.js"
          fetch "data/topics.json" "$tmp/topics.json"
          fetch "data/search-index.json" "$tmp/search-index.json"
          fetch "sitemap.xml" "$tmp/sitemap.xml"

          grep -Fq "?v=${published_version}" "$tmp/home.html"
          grep -q '"number": 35' "$tmp/topics.json"
          test "$(grep -o '<loc>' "$tmp/sitemap.xml" | wc -l | tr -d ' ')" = "36"
          grep -Fq '<loc>https://diego-ch4m4x.github.io/Guia_Logica/</loc>' "$tmp/sitemap.xml"
          grep -Fq '<loc>https://diego-ch4m4x.github.io/Guia_Logica/topicos/t35/</loc>' "$tmp/sitemap.xml"

          echo "production routes: 36/36"
          echo "PRODUCTION_SMOKE: PASS"
          echo "base_url=$base"
